name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Stub (default features) must pass on Linux, macOS, and Windows without libzmq.
# Optional corpus-ipc / ZeroMQ is Linux-only: GitHub-hosted macOS and Windows
# runners do not install libzmq, so those OSes skip the feature job.
# rustfmt is OS-independent and runs on Ubuntu only. See docs/ci.md.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  stub:
    name: stub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Feature-scoped: stub restore-keys must not prefix-match corpus-ipc.
          key: ${{ runner.os }}-stub-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-stub-

      - name: Run clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --locked

      - name: Test (default features)
        run: cargo test --locked

  corpus-ipc:
    name: corpus-ipc (ubuntu)
    runs-on: ubuntu-latest
    # Rust 1.99's default rust-lld links the static libzmq test binary into a
    # SIGSEGV on ubuntu-latest (26.04) before any test prints. The system
    # linker does not. Stub jobs do not link libzmq.
    env:
      RUSTFLAGS: -C linker-features=-lld
    # Bound the job even if a native socket call regresses into a blocking wait.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libzmq
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Feature-scoped: corpus-ipc restore-keys must not prefix-match stub.
          key: ${{ runner.os }}-corpus-ipc-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-corpus-ipc-

      - name: Run clippy (all-features)
        env:
          CC: gcc
          CXX: g++
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build (all-features)
        env:
          CC: gcc
          CXX: g++
        run: cargo build --locked --all-features

      - name: Test (all-features)
        env:
          CC: gcc
          CXX: g++
        run: |
          set +e
          cargo test --locked --all-features
          status=$?
          if [ "$status" -ne 0 ]; then
            # The lib test binary SIGSEGVs on ubuntu-latest before any test
            # name is printed. Capture the faulting frame on that runner.
            sudo apt-get install -y gdb
            echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope >/dev/null || true
            bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'brainstem_daemon-*' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
            echo "faulting binary: $bin"
            uname -a
            grep -m1 'flags\|model name' /proc/cpuinfo || true
            readelf -n "$bin" || true
            ldd "$bin" || true
            gdb -batch \
              -ex "set pagination off" \
              -ex "set debuginfod enabled off" \
              -ex "run" \
              -ex "thread apply all bt" \
              -ex "info registers" \
              -- "$bin" || true
          fi
          exit "$status"

  package:
    name: packaged release (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualify the candidate itself, not the synthetic PR merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install libzmq
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: "1.99.0"

      - name: Qualify Cargo archive and fresh installs
        run: python3 .github/scripts/qualify-package.py target/package-evidence

      - name: Retain candidate evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/package-evidence/
          if-no-files-found: warn
          retention-days: 90
