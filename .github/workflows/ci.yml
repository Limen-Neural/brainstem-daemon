name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Stub (default features) must pass on Linux, macOS, and Windows without libzmq.
# Optional corpus-ipc / ZeroMQ is Linux-only: GitHub-hosted macOS and Windows
# runners do not install libzmq, so those OSes skip the feature job.
# rustfmt is OS-independent and runs on Ubuntu only. See docs/ci.md.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.1
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  stub:
    name: stub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.1
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stub-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stub-
            ${{ runner.os }}-cargo-

      - name: Run clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build

      - name: Test (default features)
        run: cargo test

  corpus-ipc:
    name: corpus-ipc (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install libzmq
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.1
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-corpus-ipc-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-corpus-ipc-
            ${{ runner.os }}-cargo-

      - name: Run clippy (all-features)
        env:
          CC: gcc
          CXX: g++
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (all-features)
        env:
          CC: gcc
          CXX: g++
        run: cargo build --all-features

      - name: Test (all-features)
        env:
          CC: gcc
          CXX: g++
        run: cargo test --all-features
