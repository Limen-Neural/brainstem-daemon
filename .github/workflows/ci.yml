name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Stub (default features) must pass on Linux, macOS, and Windows without libzmq.
# Optional corpus-ipc / ZeroMQ runs on Linux and macOS after installing system
# libzmq. Windows skips that job: GitHub-hosted Windows images do not ship
# libzmq, and installing it would couple the portable stub matrix to optional
# native deps. rustfmt is OS-independent and runs on Ubuntu only.
# Azure Pipelines (azure-pipelines.yml) is the independent OS matrix.
# See docs/ci.md.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.1
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  stub:
    name: stub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.1
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Feature-scoped: stub restore-keys must not prefix-match corpus-ipc.
          key: ${{ runner.os }}-stub-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-stub-

      - name: Run clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --locked

      - name: Test (default features)
        run: cargo test --locked

  corpus-ipc:
    name: corpus-ipc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install libzmq (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install libzmq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zeromq pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix zeromq)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.1
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Feature-scoped: corpus-ipc restore-keys must not prefix-match stub.
          key: ${{ runner.os }}-corpus-ipc-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-corpus-ipc-

      - name: Run clippy (all-features)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build (all-features)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cargo build --locked --all-features

      - name: Test (all-features)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cargo test --locked --all-features
