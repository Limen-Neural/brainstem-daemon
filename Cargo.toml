[package]
name = "brainstem-daemon"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "SNN Engine + Inference + Telemetry + AI (Tier 1 — headless)"
authors = ["Raul Montoya Cardenas <montoya34raul@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Limen-Neural/brainstem-daemon"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
corpus-ipc = { git = "https://github.com/Limen-Neural/corpus-ipc", rev = "78220a6413c20f202252016afbf5981b7350dfd0", features = ["zmq"], optional = true }
neuromod = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
zmq = { version = "0.10", optional = true }

[features]
default = []
corpus-ipc = ["dep:corpus-ipc", "dep:zmq"]

[[bin]]
name = "brainstem-daemon"
path = "src/bin/brainstem_daemon.rs"

# Cargo profiles (dev / release / release-with-debug / test / bench).
# Keep settings conservative — no maximum-optimization knobs that over-promise
# for a headless inference daemon. Aligned with the `neuromod` profile pattern.
# See README.md "Cargo profiles" for how each is used.

[profile.dev]
# Fast compile + full debug info for local development (`cargo build` / `cargo run`).
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
# Optimized binary for running `brainstem-daemon` (`cargo build --release`).
opt-level = 3
lto = "thin"
strip = "debuginfo"
debug = false

[profile.release-with-debug]
# Release optimization with debug symbols kept, for `perf` / flamegraphs /
# `tracing` on the 1 kHz tick loop without paying for a full debug build.
# Use with `cargo build --profile release-with-debug`.
inherits = "release"
debug = true
strip = false

[profile.test]
# Used by `cargo test`. Prefer debuggability and arithmetic safety over speed.
opt-level = 0
debug = true
overflow-checks = true

[profile.bench]
# Used by `cargo bench`. Match release optimization so timings reflect release
# builds, but keep debug symbols so benchmarks stay profileable (e.g. with
# flamegraphs), unlike the stripped `release` binary.
inherits = "release"
debug = true
strip = false
