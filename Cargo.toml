[package]
name = "brainstem-daemon"
version = "0.1.2"
edition = "2024"
# Keep identical to rust-toolchain.toml `channel` and the CI workflow
# `toolchain:` pin (see REVIEW.md "MSRV pin rule").
rust-version = "1.98.1"
description = "Headless spiking-neural-network runtime: inference, telemetry, and optional ZeroMQ I/O"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Limen-Neural/brainstem-daemon"
homepage = "https://github.com/Limen-Neural/brainstem-daemon"
documentation = "https://docs.rs/brainstem-daemon"
readme = "README.md"
keywords = ["snn", "neuromorphic", "spiking", "daemon", "inference"]
categories = ["science", "simulation", "command-line-utilities"]
exclude = [
    ".github/",
    ".devin/",
    "AGENTS.md",
    "REVIEW.md",
    "Dockerfile",
    ".codacy.yml",
    ".deepsource.toml",
    "docs/",
]

[package.metadata.docs.rs]
# Default crate only. The `corpus-ipc` feature compiles ZeroMQ (C/C++).
all-features = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
corpus-ipc = { version = "0.1.0", features = ["zmq"], optional = true }
# Pre-1.0: Cargo treats 0.6.z as compatible (`>=0.6.0, <0.7.0`).
neuromod = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
zmq = { version = "0.10", optional = true }
sha2 = "0.11"

[features]
default = []
corpus-ipc = ["dep:corpus-ipc", "dep:zmq"]

[[bin]]
name = "brainstem-daemon"
path = "src/bin/brainstem_daemon.rs"

[[test]]
name = "thalamic_brainstem_smoke"
required-features = ["corpus-ipc"]

# Cargo profiles (dev / release / release-with-debug / test / bench).
# Keep settings conservative — no maximum-optimization knobs that over-promise
# for a headless inference daemon. Aligned with the `neuromod` profile pattern.
# See README.md "Cargo profiles" for how each is used.

[profile.dev]
# Fast compile + full debug info for local development (`cargo build` / `cargo run`).
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
# Optimized binary for running `brainstem-daemon` (`cargo build --release`).
opt-level = 3
lto = "thin"
strip = "debuginfo"
debug = false

[profile.release-with-debug]
# Release optimization with debug symbols kept, for `perf` / flamegraphs /
# `tracing` on the 1 kHz tick loop without paying for a full debug build.
# Use with `cargo build --profile release-with-debug`.
inherits = "release"
debug = true
strip = false

[profile.test]
# Used by `cargo test`. Prefer debuggability and arithmetic safety over speed.
opt-level = 0
debug = true
overflow-checks = true

[profile.bench]
# Used by `cargo bench`. Match release optimization so timings reflect release
# builds, but keep debug symbols so benchmarks stay profileable (e.g. with
# flamegraphs), unlike the stripped `release` binary.
inherits = "release"
debug = true
strip = false
